<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal h-screen flex flex-col">
<nav class="bg-purple-800 p-4 shadow-lg">
    <div class="container mx-auto flex justify-between items-center text-white">
        <span class="font-bold text-xl tracking-wide">👑 Panel Super Admin</span>
        <a href="/dashboard/" class="hover:underline text-sm">Kembali ke Dashboard</a>
    </div>
</nav>

<div class="container mx-auto mt-8 px-4 flex-grow grid grid-cols-1 md:grid-cols-3 gap-6">
    <div class="bg-white rounded-lg shadow-md p-6 h-fit border border-gray-200">
        <h3 class="text-xl font-bold text-gray-800 mb-4 border-b pb-2">Tambah Staf Baru</h3>
        <form action="/dashboard/superadmin/staff" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Nama Lengkap</label>
                <input type="text" name="nama" required class="w-full px-3 py-2 border rounded-md focus:ring-purple-500 focus:border-purple-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" name="email" required class="w-full px-3 py-2 border rounded-md focus:ring-purple-500 focus:border-purple-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Password Sementara</label>
                <input type="password" name="password" required class="w-full px-3 py-2 border rounded-md focus:ring-purple-500 focus:border-purple-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Pilih Jabatan</label>
                <select name="role" required class="w-full px-3 py-2 border rounded-md focus:ring-purple-500 focus:border-purple-500">
                    <option value="dokter">Dokter</option>
                    <option value="resepsionis">Resepsionis</option>
                </select>
            </div>
            <button type="submit" class="w-full bg-purple-600 text-white font-bold py-2 px-4 rounded-md hover:bg-purple-700">Daftarkan Staf</button>
        </form>
    </div>

    <div class="bg-white rounded-lg shadow-md p-6 col-span-2 border border-gray-200">
        <h3 class="text-xl font-bold text-gray-800 mb-4 border-b pb-2">Daftar Staf Aktif</h3>
        <div class="overflow-x-auto">
            <table class="min-w-full bg-white border">
                <thead class="bg-gray-100 text-gray-600 uppercase text-sm leading-normal">
                <tr>
                    <th class="py-3 px-6 text-left">Nama</th>
                    <th class="py-3 px-6 text-left">Email</th>
                    <th class="py-3 px-6 text-center">Jabatan</th>
                </tr>
                </thead>
                <tbody class="text-gray-600 text-sm font-light">
                {{ range .staffs }}
                <tr class="border-b border-gray-200 hover:bg-gray-50">
                    <td class="py-3 px-6 text-left font-medium">{{ .Nama }}</td>
                    <td class="py-3 px-6 text-left">{{ .Email }}</td>
                    <td class="py-3 px-6 text-center">
                        <span class="bg-purple-100 text-purple-700 py-1 px-3 rounded-full text-xs font-bold uppercase">{{ .Role }}</span>
                    </td>
                </tr>
                {{ end }}
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
