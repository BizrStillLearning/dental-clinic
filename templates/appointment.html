<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal h-screen flex flex-col">

<nav class="bg-blue-800 p-4 shadow-lg">
    <div class="container mx-auto flex justify-between items-center text-white">
        <span class="font-bold text-xl tracking-wide">🏥 E-Clinic Panel</span>
        <div class="space-x-4">
            <a href="/dashboard/" class="hover:underline text-sm">Kembali</a>
            <a href="/logout" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-lg text-sm font-semibold transition">Logout</a>
        </div>
    </div>
</nav>

<div class="container mx-auto mt-10 px-4 flex-grow">
    <div class="bg-white rounded-lg shadow-md p-8 max-w-lg mx-auto border border-gray-200">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-2">Buat Janji Temu Dokter</h2>

        {{ if .error }}
        <div class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-6">
            <p>{{ .error }}</p>
        </div>
        {{ end }}

        <form action="/dashboard/buat-janji" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Pilih Dokter</label>
                <select name="dokter_id" required class="w-full px-4 py-2 border rounded-md focus:ring-blue-500 focus:border-blue-500">
                    <option value="" disabled selected>-- Silakan Pilih Dokter --</option>
                    {{ range .dokters }}
                    <option value="{{ .ID }}">dr. {{ .Nama }}</option>
                    {{ end }}
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal Pemeriksaan</label>
                <input type="date" name="tanggal" required class="w-full px-4 py-2 border rounded-md focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Keluhan Anda</label>
                <textarea name="keluhan" rows="4" required placeholder="Jelaskan secara singkat keluhan yang dirasakan..." class="w-full px-4 py-2 border rounded-md focus:ring-blue-500 focus:border-blue-500"></textarea>
            </div>

            <div class="pt-4">
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-md hover:bg-blue-700 transition duration-300">
                    Kirim Permintaan
                </button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
