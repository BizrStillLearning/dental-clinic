<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal flex h-screen overflow-hidden">

<aside class="w-64 bg-slate-800 text-white flex flex-col shadow-xl z-20">
    <div class="h-16 flex items-center justify-center font-bold text-2xl border-b border-slate-700 tracking-wider">
        🏥 E-Clinic
    </div>
    <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
        <a href="/dashboard/" class="block px-4 py-3 rounded-lg hover:bg-slate-700 transition">🏠 Dashboard Utama</a>
        <a href="/dashboard/buat-janji" class="block px-4 py-2 rounded bg-blue-600 hover:bg-blue-700 transition">📅 Buat Janji Temu</a>
        <a href="/dashboard/riwayat" class="block px-4 py-2 rounded hover:bg-slate-700 transition">📂 Riwayat Medis Saya</a>
    </nav>
</aside>

<div class="flex-1 flex flex-col overflow-hidden">
    <header class="h-16 bg-white shadow flex items-center justify-between px-8 z-10">
        <h2 class="text-xl font-semibold text-gray-800">{{ .title }}</h2>
        <div class="flex items-center space-x-6">
            <span class="text-gray-600">Halo, <strong class="text-blue-700">{{ .nama }}</strong> (<span class="uppercase text-xs font-bold">{{ .role }}</span>)</span>
            <a href="/logout" class="bg-red-50 text-red-600 border border-red-200 px-4 py-2 rounded hover:bg-red-500 hover:text-white transition font-medium text-sm">Logout</a>
        </div>
    </header>
    <main class="flex-1 overflow-x-hidden overflow-y-auto bg-slate-50 p-8 flex justify-center items-start">
        <div class="bg-white rounded-xl shadow-sm p-8 border border-slate-200 w-full max-w-xl mt-4">
            <h2 class="text-2xl font-bold text-slate-800 mb-6 border-b pb-2">🩺 Formulir Janji Temu</h2>
            {{ if .error }}
            <div class="bg-red-50 border-l-4 border-red-500 text-red-700 p-4 mb-6 rounded-r">
                <p class="font-medium">{{ .error }}</p>
            </div>
            {{ end }}
            <form action="/dashboard/buat-janji" method="POST" class="space-y-5">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Pilih Dokter Jaga <span class="text-red-500">*</span></label>
                    <select name="dokter_id" required class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 bg-slate-50">
                        <option value="" disabled selected>-- Silakan Pilih Dokter --</option>
                        {{ range .dokters }}
                        <option value="{{ .ID }}">dr. {{ .Nama }}</option>
                        {{ end }}
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Tanggal Pemeriksaan <span class="text-red-500">*</span></label>
                    <input type="date" name="tanggal" required class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 bg-slate-50">
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Keluhan Medis <span class="text-red-500">*</span></label>
                    <textarea name="keluhan" rows="4" required placeholder="Contoh: Demam tinggi sejak 2 hari yang lalu dan sering mual..." class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 bg-slate-50"></textarea>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition shadow-md">
                        Kirim Permintaan Antrean
                    </button>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
