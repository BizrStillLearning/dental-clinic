<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal flex h-screen overflow-hidden">

<div class="flex-1 flex flex-col w-full h-full">
    <nav class="bg-slate-800 p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center text-white">
            <span class="font-bold text-xl tracking-wide">💳 {{ .title }}</span>
            <a href="/dashboard/kasir" class="hover:underline text-sm bg-slate-700 px-4 py-2 rounded-lg">Batal & Kembali</a>
        </div>
    </nav>

    <main class="flex-1 overflow-y-auto p-8 flex justify-center items-start">
        <div class="bg-white rounded-lg shadow-md p-8 border border-gray-200 w-full max-w-2xl mt-4">

            <div class="bg-blue-50 border-l-4 border-blue-500 p-4 mb-6 rounded shadow-sm">
                <h3 class="text-lg font-bold text-blue-800 mb-2">Rincian Layanan Pasien</h3>
                <p class="text-gray-700 text-sm"><strong>Nama Pasien:</strong> {{ .transaksi.Appointment.User.Nama }}</p>
                <p class="text-gray-700 text-sm"><strong>Dokter Pemeriksa:</strong> dr. {{ .transaksi.Appointment.Dokter.Nama }}</p>
            </div>

            <form action="/dashboard/kasir/bayar/{{ .transaksi.ID }}" method="POST" class="space-y-6">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Total Biaya Tagihan (Rp) <span class="text-red-500">*</span></label>
                    <p class="text-xs text-gray-500 mb-2">Masukkan angka saja tanpa titik (Contoh: 150000)</p>
                    <input type="number" name="total_biaya" required min="0" placeholder="150000" class="w-full px-4 py-3 border border-gray-300 rounded-md focus:ring-emerald-500 focus:border-emerald-500 font-mono text-lg">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Metode Pembayaran <span class="text-red-500">*</span></label>
                    <select name="metode_pembayaran" required class="w-full px-4 py-3 border border-gray-300 rounded-md focus:ring-emerald-500 focus:border-emerald-500">
                        <option value="Tunai">Tunai / Cash</option>
                        <option value="QRIS">QRIS</option>
                        <option value="Transfer Bank">Transfer Bank</option>
                        <option value="Menunggak (Piutang)">Belum Bayar (Masuk Piutang)</option>
                    </select>
                </div>

                <div class="pt-4">
                    <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-3 px-4 rounded-md hover:bg-emerald-700 transition shadow-md text-lg">
                        Proses Pembayaran & Selesaikan
                    </button>
                </div>
            </form>

        </div>
    </main>
</div>
</body>
</html>
