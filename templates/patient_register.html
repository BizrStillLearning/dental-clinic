<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal flex h-screen overflow-hidden">

<aside class="w-64 bg-slate-800 text-white flex flex-col shadow-xl z-20">
    <div class="h-16 flex items-center justify-center font-bold text-2xl border-b border-slate-700 tracking-wider">
        🏥 E-Clinic
    </div>
    <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
        <a href="/dashboard/" class="block px-4 py-3 rounded-lg hover:bg-slate-700 transition">🏠 Dashboard Utama</a>
        <div class="pt-4 pb-2"><span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Menu Navigasi</span></div>

        <a href="/dashboard/kasir" class="block px-4 py-2 rounded hover:bg-slate-700 transition">💳 Meja Kasir</a>
        <a href="/dashboard/register-pasien" class="block px-4 py-2 rounded bg-blue-600 hover:bg-blue-700 transition">📝 Pendaftaran Pasien</a>
    </nav>
</aside>

<div class="flex-1 flex flex-col overflow-hidden">

    <header class="h-16 bg-white shadow flex items-center justify-between px-8 z-10">
        <h2 class="text-xl font-semibold text-gray-800">{{ .title }}</h2>
        <div class="flex items-center space-x-6">
            <span class="text-gray-600">Halo, <strong class="text-blue-700">{{ .nama }}</strong> (<span class="uppercase text-xs font-bold">RESEPSIONIS</span>)</span>
            <a href="/logout" class="bg-red-50 text-red-600 border border-red-200 px-4 py-2 rounded hover:bg-red-500 hover:text-white transition font-medium text-sm">Logout</a>
        </div>
    </header>

    <main class="flex-1 overflow-x-hidden overflow-y-auto bg-slate-50 p-8">
        <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-sm p-8 border border-slate-200">
            <h2 class="text-2xl font-bold text-slate-800 mb-6 border-b pb-2">📝 Pendaftaran Pasien Baru</h2>

            <form action="/dashboard/register-pasien" method="POST" class="space-y-6">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Nama Lengkap</label>
                    <input type="text" name="nama" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Nomor Induk Kependudukan (NIK)</label>
                        <input type="text" name="nik" required pattern="[0-9]{16}" title="NIK harus 16 digit angka" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Tanggal Lahir</label>
                        <input type="date" name="tanggal_lahir" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Nomor HP</label>
                        <input type="text" name="nomor_hp" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Riwayat Alergi Obat</label>
                        <input type="text" name="alergi" placeholder="Kosongkan jika tidak ada" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Alamat Lengkap</label>
                    <textarea name="alamat" rows="3" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-blue-500 focus:border-blue-500"></textarea>
                </div>

                <div class="pt-4">
                    <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition shadow-md">
                        Simpan Data Pasien
                    </button>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
